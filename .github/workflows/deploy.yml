# Production deploys for loadednacho, meiji, cove, and canrocks only.
# Uses the Cloudflare API pipeline in tools/. Never runs `wrangler deploy`.
# sites/feast, sites/toc, sites/feast-toc-src, and shared/ are not deployed.

name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  precheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pre-checks (dry run, no deploy)
        run: |
          node tools/deploylib.mjs dry-run
          node tools/deploy-check.mjs
          node sites/storage-api/test-admin.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy changed production sites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          changed=$(mktemp)
          node tools/deploylib.mjs changed "${{ github.event.before }}" "${{ github.sha }}" > "$changed"
          mapfile -t sites < "$changed"
          if [ "${#sites[@]}" -eq 0 ]; then
            echo "No changes under sites/{loadednacho,meiji,cove,canrocks}/. Nothing to deploy."
            exit 0
          fi
          for site in "${sites[@]}"; do
            case "$site" in
              loadednacho|meiji|cove|canrocks) ;;
              *)
                echo "refusing to deploy unexpected site: $site" >&2
                exit 2
                ;;
            esac
            echo "Deploying $site"
            node tools/deploylib.mjs deploy "$site"
          done
